name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Run Bandit security scan
        run: uv run bandit -r app

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Build Docker image
        run: docker build -t cicd-demo .

      - name: Start Docker container
        run: docker run -d --name cicd-demo -p 8000:8000 cicd-demo

      - name: Inspect container
        run: |
          docker ps -a
          docker inspect cicd-demo --format '{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}'

      - name: Show container logs
        if: always()
        run: docker logs cicd-demo || true

      - name: Smoke test
        run: |
          echo "Waiting for application to start..."

          for i in {1..10}; do
            if curl --fail http://localhost:8000/health; then
              echo "Application is ready"
              exit 0
            fi

            echo "Not ready yet, retrying..."
            sleep 1
          done

          echo "Application did not become ready"
          docker ps -a
          docker logs cicd-demo || true
          exit 1